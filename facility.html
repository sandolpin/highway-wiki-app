<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>施設詳細 - 高速道路Wikipediaガイド</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/badges.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="facility">
  <div class="app-shell">
    <!-- 左固定サイドバー -->
    <aside class="sidebar">
      <button type="button" id="backToRouteBtn" class="back-btn" title="路線一覧へ戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>路線へ戻る</span>
      </button>

      <!-- 高速道路 施設タイトルプレート -->
      <div class="route-sign-plate">
        <div class="route-sign-top">
          <span class="route-num-badge" id="facilityRouteNum">E1</span>
        </div>
        <div class="route-sign-name" id="facilityTitleName">読み込み中...</div>
      </div>

      <!-- 表示セクション（クリックで該当位置へスクロール） -->
      <nav class="sidebar-nav" aria-label="表示切替">
        <button type="button" class="nav-item active" data-tab="overview">概要</button>
        <button type="button" class="nav-item" data-tab="detail" id="facilityDetailTabBtn">施設</button>
      </nav>

      <!-- 表示モード切替 -->
      <div class="display-mode-box">
        <span class="display-mode-label">表示</span>
        <div class="display-mode-buttons">
          <button type="button" class="mode-btn active" data-mode="original">オリジナル</button>
          <button type="button" class="mode-btn" data-mode="raw">Wikipedia原文</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <a id="wikiFacilitySourceLink" href="https://ja.wikipedia.org/" target="_blank" rel="noopener noreferrer">
          Wikipediaの元記事を開く ↗
        </a>
      </div>
    </aside>

    <!-- 右メインコンテンツ -->
    <main class="main-content" id="facilityMainContent">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Wikipediaから施設データを取得しています...</p>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
