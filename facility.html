<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>施設詳細 - 高速道路Wikipediaガイド</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/badges.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="facility">
  <div class="app-layout">
    <!-- 左サイドバー（共有画像3準拠） -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button type="button" id="backToRouteBtn" class="back-btn">
          <span class="back-btn-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </span>
          <span>前のページに戻る</span>
        </button>

        <div class="title-plate" id="facilityTitlePlate">
          <span class="route-num-badge" id="facilityRouteNum">E1</span>
          <span class="title-plate-name" id="facilityTitleName">海老名SA</span>
        </div>

        <nav class="sidebar-nav" aria-label="施設メニュー">
          <button type="button" class="nav-item" data-tab="overview">概要</button>
          <button type="button" class="nav-item active" data-tab="detail" id="facilityDetailTabBtn">施設</button>
        </nav>

        <div class="display-mode-box">
          <div class="display-mode-label">施設表示設定</div>
          <div class="display-mode-buttons">
            <button type="button" class="mode-btn active" data-mode="original">オリジナル</button>
            <button type="button" class="mode-btn" data-mode="raw">原文</button>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        記事はwikipediaより<br />引用しております。
        <br />
        <a id="wikiFacilitySourceLink" href="https://ja.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipediaで原文を見る ↗</a>
      </div>
    </aside>

    <!-- 右側メインエリア -->
    <main class="main-content" id="facilityMainContent">
      <div class="loading-box">
        <div class="spinner"></div>
        <div>Wikipediaから施設情報を読み込んでいます...</div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
