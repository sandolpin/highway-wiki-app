<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高速道路Wikipediaガイド - 路線を選ぶ</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/badges.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="index">
  <header class="top-header">
    <div class="top-header-inner">
      <div class="top-brand">
        <div class="top-brand-sign">HW-WIKI</div>
        <div>
          <h1>高速道路 路線・施設ガイド</h1>
          <p>Wikipediaの路線データ・IC/SA情報を高速道路案内標識風のUIで閲覧</p>
        </div>
      </div>
    </div>
  </header>

  <main class="top-container">
    <!-- 検索・カスタムWikipedia呼び出しパネル -->
    <section class="search-panel" aria-label="路線検索">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
          <input
            type="text"
            id="routeSearchInput"
            class="search-input"
            placeholder="路線名・読み仮名・ナンバリング・区間を検索（例：東名、とうめい、やまがた、E1）"
          />
        </div>

        <form id="directWikiForm" class="direct-wiki-form">
          <input
            type="text"
            id="directWikiInput"
            class="direct-wiki-input"
            placeholder="Wikipedia記事名を直接指定（例：新湘南バイパス）"
          />
          <button type="submit" class="direct-wiki-btn">記事を開く</button>
        </form>
      </div>

      <div class="filter-pills" id="operatorFilters">
        <button type="button" class="filter-pill active" data-operator="all">すべて</button>
        <button type="button" class="filter-pill" data-operator="NEXCO東日本">NEXCO東日本</button>
        <button type="button" class="filter-pill" data-operator="NEXCO中日本">NEXCO中日本</button>
        <button type="button" class="filter-pill" data-operator="NEXCO西日本">NEXCO西日本</button>
        <button type="button" class="filter-pill" data-operator="urban">都市高速・本四高速</button>
      </div>
    </section>

    <!-- 簡易マップ ＋ 路線カード一覧 -->
    <div class="top-main-grid">
      <!-- 左：日本列島・高速道路ネットワーク簡易マップ -->
      <aside class="map-card">
        <div class="map-card-header">
          <span class="map-card-title">エリア・幹線ネットワーク簡易マップ</span>
          <button type="button" id="resetRegionBtn" class="map-reset-btn">全国表示に戻す</button>
        </div>
        <div class="japan-map-wrap" id="japanMapWrap">
          <!-- renderer.js によりインタラクティブSVGマップを描画 -->
        </div>
        <p style="font-size: 11.5px; color: #666; margin-top: 8px;">
          ※ 地方エリアをクリックすると路線を絞り込み、路線ラインをクリックすると詳細画面へ移動します。
        </p>
      </aside>

      <!-- 右：路線カード一覧 -->
      <section>
        <div class="routes-section-header">
          <h2 class="routes-section-title" id="routesListHeading">すべての高速道路路線</h2>
          <span class="routes-count-badge" id="routesCountBadge">0 路線</span>
        </div>
        <div class="routes-grid" id="routesGrid">
          <!-- app.js により路線カードを生成 -->
        </div>
      </section>
    </div>
  </main>

  <footer style="text-align: center; padding: 20px; font-size: 12.5px; color: #777; border-top: 1px solid #e5e5e5;">
    本アプリの路線・施設データは <a href="https://ja.wikipedia.org/" target="_blank" rel="noopener noreferrer" style="text-decoration: underline; color: #1b7837;">Wikipedia</a>（CC BY-SA 4.0）より取得・引用しています。
  </footer>

  <script src="js/api.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
